---
deployment:
  tasks:
    # 1. Unzip the built frontend (Next.js static export) directly to public_html
    - unzip -o frontend_out.zip -d /home/baitmtzi/public_html/

    # 2. Install/update backend Python dependencies
    - source /home/baitmtzi/forcli/bin/activate && pip install -r requirements.txt --quiet

    # 3. Apply any new database migrations
    - source /home/baitmtzi/forcli/bin/activate && python manage.py migrate --noinput

    # 4. Collect static files
    - source /home/baitmtzi/forcli/bin/activate && python manage.py collectstatic --noinput --clear
